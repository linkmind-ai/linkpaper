# 평가 전용 데이터베이스.
#
# 루트 docker-compose.yml을 건드리지 않으려고 파일을 분리했다. 포트와
# 볼륨 이름이 달라서 서비스 스택과 동시에 띄워도 충돌하지 않는다.
# 벤치마크 코퍼스를 서비스 DB에 섞지 않는 것이 목적이다.
#
#   cd evaluation
#   docker compose -f docker-compose.eval.yml up -d
#
# 접속 정보는 아래 기본값과 맞춰 둔다:
#   export QDRANT_URL=http://localhost:6343
#   export NEO4J_URI=bolt://localhost:7688

name: linkpaper-eval

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${EVAL_QDRANT_HTTP_PORT:-6343}:6333"
      - "${EVAL_QDRANT_GRPC_PORT:-6344}:6334"
    volumes:
      - eval_qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant 이미지에는 curl/wget이 없어서 셸 내장 기능으로 확인한다.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && head -1 <&3 | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-linkpaper-password}"
    ports:
      - "${EVAL_NEO4J_HTTP_PORT:-7475}:7474"
      - "${EVAL_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - eval_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  eval_qdrant_data:
  eval_neo4j_data:

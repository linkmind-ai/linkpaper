[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkpaper-indexing"
version = "0.1.0"
description = "LinkPaper 오프라인 인덱싱 모듈 (논문 수집·전처리 및 지식그래프 구축)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1.0",
    "langchain-text-splitters>=0.3,<2.0",
    "neo4j>=5.26,<7.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pymupdf4llm>=0.0.17,<2.0",
    "qdrant-client>=1.12,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
linkpaper-data-pipeline = "data_pipeline.cli:main"
linkpaper-indexing = "indexing_job.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "data_pipeline",
    "graph_builder",
    "indexing_common",
    "indexing_job",
    "vector_builder",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: 로컬 Docker 저장소를 사용하는 opt-in 테스트",
]
testpaths = [
    "data_pipeline/tests",
    "graph_builder/tests",
    "indexing_common/tests",
    "indexing_job/tests",
    "vector_builder/tests",
]
